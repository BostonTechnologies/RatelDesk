<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">RatelDesk mark</title>
<desc id="desc">Neon honey badger inside a ticket-shaped service desk shield.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0D1026"/>
    <stop offset="1" stop-color="#050610"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#35D9FF"/>
    <stop offset=".45" stop-color="#AF2BFF"/>
    <stop offset="1" stop-color="#FF37D1"/>
  </linearGradient>
  <linearGradient id="fur" x1="0" y1="0" x2=".9" y2=".9">
    <stop stop-color="#F5F3FF"/>
    <stop offset=".34" stop-color="#B8C7FF"/>
    <stop offset=".35" stop-color="#1B2142"/>
    <stop offset="1" stop-color="#070914"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>

<!-- transparent canvas -->
<path d="M512 68
         C697 68 848 146 914 286
         L914 503
         C914 585 872 669 805 730
         L512 942
         L219 730
         C152 669 110 585 110 503
         L110 286
         C176 146 327 68 512 68Z"
      fill="url(#bg)" stroke="#171C3A" stroke-width="34"/>
<path d="M512 96
         C683 96 817 165 876 298
         L876 490
         C876 555 842 625 784 680
         L512 884
         L240 680
         C182 625 148 555 148 490
         L148 298
         C207 165 341 96 512 96Z"
      fill="none" stroke="url(#neon)" stroke-width="13" filter="url(#glow)"/>

<!-- ticket notches / desk cue -->
<path d="M132 410 h76 v58 h-76 M892 410 h-76 v58 h76" fill="none" stroke="#35D9FF" stroke-width="10" opacity=".75"/>

<!-- subtle circuit rays -->
<g stroke="url(#neon)" stroke-width="8" opacity=".42" fill="none">
  <path d="M230 268 H330 L378 316"/>
  <path d="M794 268 H694 L646 316"/>
  <path d="M192 532 H300 L346 486"/>
  <path d="M832 532 H724 L678 486"/>
</g>
<g fill="#35D9FF" filter="url(#glow)">
  <circle cx="230" cy="268" r="7"/><circle cx="794" cy="268" r="7"/>
  <circle cx="192" cy="532" r="7"/><circle cx="832" cy="532" r="7"/>
</g>

<!-- honey badger shoulders -->
<path d="M273 655
         C302 552 335 493 385 453
         C421 424 461 411 512 413
         C563 411 603 424 639 453
         C689 493 722 552 751 655
         C681 724 606 755 512 755
         C418 755 343 724 273 655Z"
      fill="#080B19" stroke="#252C57" stroke-width="10"/>

<!-- head silhouette -->
