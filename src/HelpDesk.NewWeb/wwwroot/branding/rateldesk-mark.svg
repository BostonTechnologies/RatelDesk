         C346 299 423 233 512 233
         C601 233 678 299 691 392
         C702 467 671 559 606 611
         C574 637 544 650 512 650
         C480 650 450 637 418 611
         C353 559 322 467 333 392Z"
      fill="#090B18" stroke="#22294F" stroke-width="10"/>

<!-- ears -->
<path d="M348 365 C293 322 281 257 327 229 C374 241 397 277 404 317Z"
      fill="#10152C" stroke="#AF2BFF" stroke-width="8"/>
<path d="M676 365 C731 322 743 257 697 229 C650 241 627 277 620 317Z"
      fill="#10152C" stroke="#AF2BFF" stroke-width="8"/>

<!-- iconic white honey-badger crown stripe -->
<path d="M337 365
         C360 282 428 225 512 225
         C596 225 664 282 687 365
         C646 337 607 323 575 318
         C549 314 530 300 512 279
         C494 300 475 314 449 318
         C417 323 378 337 337 365Z"
      fill="url(#fur)" stroke="#F5F3FF" stroke-width="5" opacity=".98"/>

<!-- cheek highlights -->
<path d="M363 423 C398 389 434 374 466 375 C437 397 416 425 401 463Z"
      fill="#273564" opacity=".75"/>
<path d="M661 423 C626 389 590 374 558 375 C587 397 608 425 623 463Z"
      fill="#273564" opacity=".75"/>

<!-- eyes -->
<path d="M397 414 Q438 393 475 416 Q439 444 397 428Z" fill="#35D9FF" filter="url(#glow)"/>
<path d="M627 414 Q586 393 549 416 Q585 444 627 428Z" fill="#35D9FF" filter="url(#glow)"/>
<path d="M414 419 Q442 408 464 419" stroke="#F5F3FF" stroke-width="5" fill="none"/>
<path d="M610 419 Q582 408 560 419" stroke="#F5F3FF" stroke-width="5" fill="none"/>

<!-- muzzle -->
<path d="M412 470
         C438 442 472 437 512 455
         C552 437 586 442 612 470
         C627 487 631 520 610 548
         C584 582 551 598 512 598
         C473 598 440 582 414 548
         C393 520 397 487 412 470Z"
      fill="#171326" stroke="#AF2BFF" stroke-width="8"/>

<!-- nose -->
<path d="M467 482 Q512 458 557 482 L544 520 Q512 537 480 520Z"
      fill="#03040A" stroke="#35D9FF" stroke-width="4"/>

<!-- open snarl -->
<path d="M430 529 Q512 591 594 529 Q575 614 512 625 Q449 614 430 529Z"
      fill="#22071A" stroke="#FF37D1" stroke-width="7"/>
<g fill="#F5F3FF">
  <path d="M449 542 l22 4 -10 32Z"/>
  <path d="M575 542 l-22 4 10 32Z"/>
  <path d="M477 561 l15 4 -6 24Z"/>
  <path d="M547 561 l-15 4 6 24Z"/>
</g>
<path d="M476 601 Q512 615 548 601" stroke="#FF5EBE" stroke-width="10" stroke-linecap="round"/>

<!-- desk/chat glyph -->
<g transform="translate(380 664)">
  <path d="M0 0 H264 Q288 0 288 24 V104 Q288 128 264 128 H146 L112 160 V128 H24 Q0 128 0 104Z"
        fill="#0D1026" stroke="url(#neon)" stroke-width="9" filter="url(#glow)"/>
  <circle cx="72" cy="64" r="10" fill="#35D9FF"/>
  <circle cx="144" cy="64" r="10" fill="#AF2BFF"/>
  <circle cx="216" cy="64" r="10" fill="#FF37D1"/>
</g>
</svg>