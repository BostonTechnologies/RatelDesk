version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 8
    commit-message:
      prefix: "Chore"
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
