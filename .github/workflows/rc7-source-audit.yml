name: rc.7 source audit

on:
  push:
    branches: [fix/rc7-remove-legacy-ai]

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Export tracked public source only
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/rateldesk-source.zip" HEAD
          git ls-files '*AGENTS.md' '*SKILL.md'
          git grep -n -i -E 'GenerateKnowledge|KnowledgeGeneration|EmbedIncident|IChatClient|IEmbeddingGenerator|Netclaw|pg_trgm' -- src ':!*.Designer.cs' ':!*ModelSnapshot.cs' || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rateldesk-rc7-source
          path: ${{ runner.temp }}/rateldesk-source.zip
          retention-days: 1
