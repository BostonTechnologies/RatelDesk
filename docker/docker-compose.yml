name: rateldesk

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rateldesk
      POSTGRES_USER: rateldesk
      POSTGRES_PASSWORD: rateldesk
    ports:
      - "127.0.0.1:${RATELDESK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - rateldesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateldesk -d rateldesk"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__HelpdeskDb: Host=postgres;Port=5432;Database=rateldesk;Username=rateldesk;Password=rateldesk
      DataProtection__KeyRingPath: /var/lib/rateldesk/keys
      PublicWebAppUrl: http://localhost:8111/
      StorageOptions__PublicApiBaseUrl: http://localhost:8222
      Branding__ApplicationName: ${Branding__ApplicationName:-}
      Branding__OrganizationName: ${Branding__OrganizationName:-}
      Branding__ApplicationUrl: ${Branding__ApplicationUrl:-}
      Branding__OrganizationUrl: ${Branding__OrganizationUrl:-}
      Branding__SupportUrl: ${Branding__SupportUrl:-}
      Branding__SupportEmail: ${Branding__SupportEmail:-}
      Branding__LogoUrl: ${Branding__LogoUrl:-}
      Branding__CompactLogoUrl: ${Branding__CompactLogoUrl:-}
      Branding__FaviconUrl: ${Branding__FaviconUrl:-}
      Branding__EmailFromDisplayName: ${Branding__EmailFromDisplayName:-}
      Branding__Tagline: ${Branding__Tagline:-}
      # Local-only value so the sample stack can generate signed links. Override
      # with a unique secret before exposing the API outside this workstation.
      StorageOptions__ImageSigningSecret: ${RATELDESK_IMAGE_SIGNING_SECRET:-development-only-change-before-production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RATELDESK_API_PORT:-8222}:8222"
    volumes:
      - rateldesk-data-protection:/var/lib/rateldesk/keys
      - rateldesk-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: http://api:8222/
      DataProtection__KeyRingPath: /var/lib/rateldesk/keys
      ReverseProxy__Clusters__apiCluster__Destinations__api1__Address: http://api:8222/
      # These non-secret local defaults validate the OIDC wiring without
      # representing a usable identity-provider client. Set all three values
      # to credentials from your provider for an actual deployment.
      Authentication__Authentik__ClientId: ${RATELDESK_OIDC_CLIENT_ID:-rateldesk-local}
      AUTHENTIK_CLIENT_SECRET: ${RATELDESK_OIDC_CLIENT_SECRET:-development-only-not-a-real-client-secret}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RATELDESK_WEB_PORT:-8111}:8111"
    volumes:
      - rateldesk-data-protection:/var/lib/rateldesk/keys

volumes:
  rateldesk-postgres-data:
  rateldesk-data-protection:
  rateldesk-storage:
